<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Content Manager – Kidus Minyelshowa</title>
        <!-- Absolute path, so the config loads whether the URL is /admin or /admin/ -->
        <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    </head>
    <body>
        <script>
            // Sign in through this site's own /api/auth, whatever domain it's served from
            window.CMS_MANUAL_INIT = true;
        </script>
        <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.16.3/dist/decap-cms.js"></script>
        <script>
            CMS.init({ config: { backend: { base_url: window.location.origin } } });
        </script>
    </body>
</html>
