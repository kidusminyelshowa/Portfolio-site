<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Price Builder</title>
<link rel="icon" type="image/png" href="/team/icons/favicon-64.png?v=2" />
<link rel="apple-touch-icon" href="/team/icons/apple-touch-180.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/team/suite.css" />
<style>
  /* colours come from /team/suite.css (shared with the Team app and proposals); these names map onto it,
     so the Price Builder follows the brand accent and the same neutrals as the Team app */
  :root{
    --inner:var(--soft); --ink2:var(--ink-2);
    --pink:var(--accent-soft); --pinkSel:var(--accent); --pinkSoft:color-mix(in srgb,var(--accent) 10%,#fff); --plum:var(--dark);
    --teal:var(--highlight-soft); --tealInk:var(--ink);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;border-radius:999px;border:0;
         background:var(--inner);color:var(--ink);padding:10px 18px;transition:background .15s,filter .15s;white-space:nowrap}
  button:hover{filter:brightness(.97)}
  button.primary{background:var(--pinkSel);color:var(--on-accent)}
  button.primary:hover{filter:brightness(.9)}
  button.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
  button.danger{background:var(--bad-soft);color:var(--bad)}
  button.small{padding:6px 12px;font-size:12.5px}
  button.quiet-del{background:transparent;color:var(--mute)}
  button.quiet-del:hover,button.quiet-del:focus-visible{background:var(--bad-soft);color:var(--bad)}
  .glyph{display:inline-block;flex:none;width:1.05em;height:1.05em;vertical-align:-.17em;line-height:0}
  .glyph svg{display:block;width:100%;height:100%}
  button.x{background:none;color:var(--mute);padding:4px 8px;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  button.x:hover{color:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,textarea,select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--inner);
        border:1.5px solid transparent;border-radius:12px;padding:10px 12px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--pinkSel);background:#fff}
  input:disabled,select:disabled{opacity:.45}
  input[type=checkbox],input[type=radio]{width:18px;height:18px;padding:0;accent-color:var(--plum);cursor:pointer;flex:none}
  input[type=number]{font-variant-numeric:tabular-nums}
  textarea{resize:vertical;min-height:74px;line-height:1.5}
  label.l{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px 2px}
  .check{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
  .muted{color:var(--mute)} .num{font-variant-numeric:tabular-nums} .right{text-align:right}
  .row{display:flex;gap:10px;align-items:center} .grow{flex:1} .wrap{flex-wrap:wrap}
  .hide{display:none !important}

  .gate{min-height:100vh;display:grid;place-items:center;padding:24px}
  .gate .card{width:100%;max-width:410px;background:var(--pink);border-radius:36px;padding:14px}
  .gate .in{background:var(--card);border-radius:28px;padding:28px}
  .gate h1{margin:0 0 6px;font-size:26px;font-weight:500;letter-spacing:-.02em}
  .gate p{margin:0 0 20px;color:var(--ink2);font-size:14px}

  header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:12px 28px;
             background:rgba(240,240,238,.92);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;font-size:15px}
  .brand .mk{width:34px;height:34px;border-radius:11px;background:var(--pinkSel);color:var(--on-accent);display:grid;place-items:center;font-weight:700;overflow:hidden}
  .brand .mk img{width:22px;height:22px;object-fit:contain}
  .brand span{color:var(--ink2);font-weight:400}
  .top .note{margin-left:auto;font-size:13px;background:var(--card);border-radius:999px;padding:6px 14px}
  .top .note:empty{display:none}
  .note.ok{color:var(--ok)} .note.err{color:var(--bad)} .note.warn{color:var(--warn)}

  main{padding:18px 28px 120px;max-width:1360px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px;flex-wrap:wrap}
  .head h1{margin:0 0 4px;font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
  .head p{margin:0;color:var(--ink2);font-size:14px;max-width:70ch}

  .panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:22px;margin-bottom:14px}
  .panel h3{margin:0 0 3px;font-size:18px;font-weight:500;letter-spacing:-.01em}
  .panel .sub{margin:0 0 14px;color:var(--ink2);font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2>.panel{margin-bottom:0}
  .grid2+.panel,.grid2+.grid2{margin-top:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .field{margin-bottom:12px}

  /* guidance */
  .hint{background:var(--teal);color:var(--tealInk);border-radius:22px;padding:16px 20px;margin-bottom:14px;font-size:14px}
  .hint b{font-weight:500;font-size:15px}
  .hint ul{margin:6px 0 0;padding-left:18px}
  .hint li{margin:2px 0}
  .steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .steps3>div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:22px;padding:16px}
  .steps3 i{flex:none;font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--pinkSoft);display:grid;place-items:center;font-weight:500}
  .steps3 b{display:block;font-weight:500;font-size:15px}
  .steps3 span{display:block;color:var(--ink2);font-size:13px}

  /* dashboard table */
  table{width:100%;border-collapse:collapse}
  .qt th{font-size:12px;color:var(--ink2);font-weight:500;text-align:left;padding:12px 14px}
  .qt td{padding:14px;border-top:1.5px solid var(--inner);vertical-align:middle}
  .qt tbody tr{cursor:pointer}
  .qt tbody tr:hover td{background:var(--soft)}
  .pill{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:4px 11px;background:var(--inner);color:var(--ink2);white-space:nowrap}
  .pill.sent{background:#E3E9FF;color:#2F438F} .pill.viewed{background:var(--warn-soft);color:var(--warn)}
  .pill.client-modified,.pill.revision-requested{background:var(--pinkSoft);color:var(--ink)}
  .pill.accepted{background:var(--ok-soft);color:var(--ok)} .pill.expired,.pill.lost{background:var(--inner);color:var(--mute)}

  /* editor */
  .steps{display:inline-flex;gap:2px;margin:0 0 16px;background:var(--ink);border-radius:999px;padding:4px;flex-wrap:wrap;max-width:100%}
  .steps button{background:transparent;color:#fff;padding:9px 16px;font-weight:500}
  .steps button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);font-size:11px;margin-right:8px}
  .steps button[aria-current="true"]{background:#fff;color:var(--ink)}
  .steps button[aria-current="true"] b{background:var(--pinkSel);color:var(--on-accent)}
  .edit{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
  .live{position:sticky;top:74px;background:var(--pink);border-radius:30px;padding:10px}
  .live>*{background:transparent}
  .live h4{margin:6px 10px 10px;font-size:15px;font-weight:500;display:flex;justify-content:space-between}
  .live h4 span{font-size:11px;background:var(--card);border-radius:999px;padding:3px 10px;font-weight:500}
  .live .ln{padding:5px 12px}
  .live .rule{margin:6px 12px}
  .live .ln.big{background:var(--card);border-radius:18px;padding:12px 14px;margin:4px 0}
  .ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13.5px}
  .ln span:first-child{color:var(--ink2)}
  .ln.big{font-size:18px;font-weight:500;padding-top:9px}
  .ln.big span:first-child{color:var(--ink)}
  .ln.client{font-weight:500}
  .ln.client span:first-child{color:var(--ink)}
  .rule{height:1.5px;background:rgba(20,20,20,.1);margin:8px 0}
  .navbtns{display:flex;justify-content:space-between;margin-top:18px}
  .navbtns button{padding:13px 22px;font-size:15px}

  /* scope */
  .cat{border-radius:26px;margin-bottom:14px;background:var(--card);padding:8px}
  .cathead{display:flex;align-items:center;gap:12px;padding:10px 12px}
  .cathead input.catname{background:transparent;border:0;padding:4px 6px;margin-left:-6px;border-radius:8px;font-size:18px;font-weight:500;max-width:340px}
  .cathead .muted{font-size:13px;background:var(--pinkSoft);color:var(--ink);border-radius:999px;padding:4px 12px}
  .items{width:100%;border-collapse:separate;border-spacing:0 6px}
  .items th{font-size:12px;color:var(--ink2);font-weight:500;text-align:left;padding:2px 8px}
  .items td{padding:8px;background:var(--inner);vertical-align:middle}
  .items td:first-child{border-radius:16px 0 0 16px;padding-left:14px}
  .items td:last-child{border-radius:0 16px 16px 0}
  .items tr.off td{background:transparent}
  .items tr.off td.nm{color:var(--mute)}
  .items td.nm{font-size:14.5px;font-weight:500;min-width:160px}
  .items td.nm small{display:block;color:var(--ink2);font-weight:400;font-size:12px}
  .items input,.items select{padding:7px 9px;font-size:13.5px;background:#fff}
  .items .w-qty{width:66px} .items .w-money{width:112px}
  .items tr.more td{background:#fff;border-radius:16px !important}
  .over{color:var(--warn);font-weight:500}
  .segs{display:inline-flex;flex-wrap:nowrap;white-space:nowrap;max-width:100%;background:var(--ink);border-radius:20px;padding:3px;gap:2px}
  .segs button{background:transparent;color:#fff;padding:6px 11px;font-size:12.5px}
  .segs button[aria-checked="true"]{background:#fff;color:var(--ink)}
  .segs.dis{opacity:.25}
  @media (max-width:600px){.segs{flex-wrap:wrap;white-space:normal}}
  .opts{border-collapse:separate;border-spacing:0 6px}
  .opts th{font-size:12px;color:var(--ink2);font-weight:500;text-align:left;padding:0 6px}
  .opts td{padding:0 4px}
  .opts input{padding:8px 10px}
  .choose{margin-top:12px;background:var(--pinkSoft);border-radius:14px;padding:10px 14px;display:inline-block}
  .addbar{display:flex;gap:9px;padding:8px 10px 6px;flex-wrap:wrap}
  /* a service's timeline editor */
  details.phases{margin:6px 10px 8px;border-top:1.5px solid var(--inner);padding-top:10px}
  details.phases>summary{cursor:pointer;font-size:14px;padding:4px 2px;list-style:none}
  details.phases>summary::-webkit-details-marker{display:none}
  details.phases>summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--inner);margin-right:8px;font-weight:600}
  details.phases[open]>summary::before{content:"–"}
  details.phases>summary .muted{font-size:13px}
  .phbody{padding:8px 2px 4px}
  .phtable tr.rev td{background:var(--warn-soft)}

  /* review */
  .review dl{display:grid;grid-template-columns:200px 1fr;gap:0;margin:0}
  .review dt,.review dd{padding:12px 0;border-top:1.5px solid var(--inner);margin:0}
  .review dt{font-size:13px;color:var(--ink2);padding-top:14px}
  .review dd .ln{padding:3px 0}
  .linkbox{display:flex;align-items:center;border-radius:14px;background:var(--inner);overflow:hidden}
  .linkbox span{padding:11px 0 11px 14px;color:var(--ink2);white-space:nowrap}
  .linkbox input{border:0;background:transparent;padding-left:1px}
  .bigtotal{font-size:34px;font-weight:500;letter-spacing:-.03em}

  /* quote view */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cmp{border-collapse:separate;border-spacing:0 4px}
  .cmp td{padding:8px 10px;font-size:13.5px;background:var(--inner)}
  .cmp td:first-child{border-radius:12px 0 0 12px} .cmp td:last-child{border-radius:0 12px 12px 0}
  .cmp th{font-size:12px;color:var(--ink2);font-weight:500;text-align:left;padding:4px 10px}
  .yes{color:var(--ok)} .no{color:var(--mute)}
  .chg td{background:var(--pinkSoft) !important}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin:0}
  .kv dt{color:var(--ink2);font-size:13px;padding-top:1px}
  .kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .theme{display:grid;gap:2px;text-align:left;background:var(--inner);border-radius:20px;padding:10px 10px 12px;white-space:normal;box-shadow:inset 0 0 0 2px transparent}
  .theme[aria-checked="true"]{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
  .theme .sw{display:flex;gap:6px;align-items:center;border-radius:14px;padding:12px;margin-bottom:6px}
  .theme .sw i{width:26px;height:26px;border-radius:50%;display:block}
  .theme .sw i:first-child{width:38px;border-radius:10px}
  .theme b{font-weight:500;font-size:14.5px;padding:0 4px}
  .theme small{color:var(--ink2);font-size:12px;font-weight:400;padding:0 4px}
  .types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .types button[aria-current="true"]{background:var(--ink);color:#fff}

  /* after the yes: contract → invoice → kick-off */
  .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .fstep{background:var(--inner);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .fstep.now{background:#fff;box-shadow:inset 0 0 0 2px var(--pinkSel)}
  .fstep.wait{opacity:.55}
  .fstep .fh{display:flex;align-items:center;gap:10px}
  .fstep .fh i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--pinkSoft);display:grid;place-items:center;font-weight:500;font-size:13px}
  .fstep.done .fh i{background:var(--ok-soft);color:var(--ok)}
  .fstep .fh b{font-weight:500;font-size:16px}
  .fstep p{margin:0;font-size:13.5px;color:var(--ink2)}
  .fstep .acts{display:flex;flex-wrap:wrap;gap:6px}
  .inv{background:var(--card);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
  .inv .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .pill.draft{background:var(--inner)} .pill.signed,.pill.paid,.pill.done{background:var(--ok-soft);color:var(--ok)}
  .pill.issued,.pill.review,.pill.contract,.pill.invoiced{background:var(--warn-soft);color:var(--warn)}
  .pill.void,.pill.cancelled{background:var(--inner);color:var(--mute);text-decoration:line-through}
  .pill.active,.pill.kicked-off{background:#E3E9FF;color:#2F438F}
  .warnbox{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:9px 12px;font-size:13px}
  /* contract editor */
  .terms .term{background:var(--inner);border-radius:16px;padding:10px;margin-bottom:8px}
  .terms .term .row input{font-weight:500}
  .terms textarea{margin-top:6px;min-height:64px;background:#fff}
  .doc{background:#fff;border-radius:22px;padding:28px 30px;font-size:13px;line-height:1.55;color:var(--ink)}
  .doc h2{font-size:24px;font-weight:600;color:var(--plum);margin:0 0 2px;letter-spacing:-.02em}
  .doc h4{font-size:14px;color:var(--plum);margin:18px 0 6px;font-weight:600}
  .doc .sub{color:var(--ink2);margin:0 0 14px}
  .doc .parties{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .doc .parties div{background:var(--card);border-radius:12px;padding:10px 12px;white-space:pre-line}
  .doc ol{padding-left:18px;margin:0} .doc li{margin:0 0 8px} .doc li b{display:block}
  .doc .ln{font-size:13px}
  .ln>span{min-width:0;overflow-wrap:anywhere}
  .stick{position:sticky;top:74px}
  dialog#dlg{border:0;border-radius:26px;padding:0;max-width:520px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
  dialog#dlg::backdrop{background:rgba(20,20,20,.35)}
  #dlgBody{padding:22px}
  #dlgBody h2{margin:0 0 6px;font-size:21px;font-weight:500;letter-spacing:-.02em}
  #dlgBody .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}

  @media(max-width:1000px){.edit,.cols{grid-template-columns:minmax(0,1fr)}.live{position:static}.flow{grid-template-columns:1fr}.stick{position:static}}
  @media(max-width:760px){main{padding:14px 12px 100px}header.top{padding:10px 12px}.grid2,.grid3,.steps3{grid-template-columns:1fr}
    .head h1{font-size:28px}.review dl{grid-template-columns:1fr}.doc .parties{grid-template-columns:1fr}.doc{padding:20px 16px}.review dt{padding-bottom:0}.review dd{border-top:0}
    .items,.qt,.opts{display:block;overflow-x:auto}.items input:not([type=checkbox]):not([type=radio]),.items select,.opts input:not([type=checkbox]):not([type=radio]){min-width:84px}.steps{border-radius:22px}}

  /* ---------- the portfolio look (kidusminyel.xyz): paper, ink outlines, hard offset shadows, navy ---------- */
  .panel,.live,.hint,.gate .card,dialog#dlg,.doc{border:var(--stroke) solid var(--stroke-c);box-shadow:none}
  .live,dialog#dlg,.gate .card{box-shadow:var(--pop)}
  .steps{background:var(--dark);border:var(--stroke) solid var(--stroke-c)}
  button.primary,button.ghost,header.top button,.head button{border:var(--stroke) solid var(--stroke-c);box-shadow:none}
  button.primary{background:var(--accent);color:var(--on-accent)}
  button.ghost{background:var(--card)}
  button.primary,button.ghost{transition:background .15s,box-shadow .15s,transform .15s}
  button.primary:hover,button.ghost:hover{filter:none;box-shadow:var(--pop-sm);transform:translate(-2px,-2px)}
  button.primary:active,button.ghost:active{box-shadow:none;transform:none}
  input:focus,textarea:focus,select:focus{border-color:var(--stroke-c)}
  .head h1{font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
  @media (prefers-reduced-motion:reduce){button:hover{transform:none !important}}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{box-shadow:var(--focus) !important}
</style>
</head>
<body>
  <div class="gate hide" id="gate">
    <form class="card" id="gateForm"><div class="in">
      <h1>Price Builder</h1>
      <p id="gateMsg">Sign in with your admin password.</p>
      <div class="field"><label class="l" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" /></div>
      <p class="note err" id="gateErr"></p>
      <button class="primary" style="width:100%;padding:14px">Sign in</button>
    </div></form>
  </div>

  <div id="app" class="hide">
    <header class="top">
      <a class="brand" href="#/"><span class="mk" id="brandMark"></span><b id="brandName" style="font-weight:600"></b> <span>Price Builder</span></a>
      <span class="note" id="note"></span>
    </header>
    <main id="view"></main>
  </div>
  <dialog id="dlg"><div id="dlgBody"></div></dialog>

  <script type="module" src="/price/builder.js"></script>
</body>
</html>
